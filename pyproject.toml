[project]
name = "fe-bar-seller-super-app"
version = "0.1.0"
description = "Fleetwise Seller Super App - Databricks FE Bar demo"
requires-python = ">=3.11"
# faker is pinned: generator output is byte-identical only on this version (same pin in the job env).
dependencies = ["faker==40.54.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs the Databricks CLI profile and live workspace access",
    "governance_mutating: rewrites the caller's demo_identity_map row; opt-in (-m governance_mutating or FLEETWISE_GOVERNANCE_MUTATING=1)",
]
