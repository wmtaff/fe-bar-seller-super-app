# Fleetwise Seller Super App - Databricks Asset Bundle.
# Extended by later tasks (pipeline, job, app).
bundle:
  name: fe-bar-seller-super-app

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all demo objects.
    default: serverless_stable_s1omq8_catalog
  schema:
    description: Schema holding all demo tables, views and volumes.
    default: seller_superapp
  volume:
    description: Managed volume for raw generator output.
    default: raw
  warehouse_id:
    description: SQL warehouse (Demo Warehouse).
    default: 9a6db1d12e2ee6d3
  serving_schema:
    description: UC schema (in the main catalog) for the Lakebase synced tables; also the Postgres schema name.
    default: serving
  lakebase_project:
    description: Lakebase Autoscaling project id.
    default: seller-superapp
  lakebase_catalog:
    description: Optional UC catalog on the Lakebase database (federated write-back fallback). Not registered here (needs CREATE CATALOG); writeback.sql skips it when absent.
    default: fleetwise_lakebase
  profile:
    description: Databricks CLI profile used to deploy and run (informational; auth is set in the target).
    default: fevm-serverless-stable-s1omq8

targets:
  dev:
    default: true
    # No `mode: development`: it force-prefixes UC objects and job names
    # (dev_<user>_seller_superapp) and an empty presets.name_prefix cannot
    # turn that off. The demo needs exact names (seller_superapp,
    # seller_superapp_daily), so this single dev target deploys unprefixed
    # to the deployer's own bundle folder.
    workspace:
      # Host comes from the CLI profile; no workspace URL is hard-coded.
      profile: fevm-serverless-stable-s1omq8
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
