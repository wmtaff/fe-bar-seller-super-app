# Daily Fleetwise job. Task 2 adds `generate_data`; later tasks extend the DAG
# (governance, pipeline refresh, AI insights, scoring, NBA, Lakebase sync ...).
resources:
  jobs:
    seller_superapp_daily:
      name: seller_superapp_daily
      description: Fleetwise Seller Super App - generate raw data, then (later tasks) refresh, score and sync.
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: init
        - name: batch
          default: "0"
        # Output goes to /Volumes/<catalog>/<schema>/<volume>/<dataset_version>/ (rulings R10, R12, R13: v4).
        - name: dataset_version
          default: v4
      environments:
        - environment_key: generator_env
          spec:
            client: "4"
            dependencies:
              # pinned so serverless output is byte-identical to local runs
              - faker==40.54.0
      tasks:
        - task_key: generate_data
          environment_key: generator_env
          spark_python_task:
            python_file: ../jobs/generate_data.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --mode
              - "{{job.parameters.mode}}"
              - --batch
              - "{{job.parameters.batch}}"
              - --seed
              - "42"
              - --dataset-version
              - "{{job.parameters.dataset_version}}"
              - --src-dir
              - ${workspace.file_path}/src
        # Task 4 (ruling R2): governance objects the pipeline depends on come first.
        - task_key: governance_setup
          depends_on:
            - task_key: generate_data
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/setup.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # silver_contacts declares `MASK fn_mask_pii`, so the mask functions must exist first.
        - task_key: governance_masks
          depends_on:
            - task_key: governance_setup
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/masks.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 3: refresh the bronze -> silver -> gold pipeline after new raw files land.
        - task_key: pipeline_refresh
          depends_on:
            - task_key: governance_masks
          pipeline_task:
            pipeline_id: ${resources.pipelines.seller_superapp_pipeline.id}
            full_refresh: false
        # Task 4: row-filter functions + governed views (they read gold_user_hierarchy).
        - task_key: apply_governance
          depends_on:
            - task_key: pipeline_refresh
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/row_filters.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 4: PII tags on pipeline tables and column comments on the governed views.
        - task_key: governance_comments_tags
          depends_on:
            - task_key: apply_governance
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/comments_tags.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 5: GenAI call insights (ai_query) -> gold_call_insights. Incremental MERGE: only
        # new/changed/failed transcripts are sent to the model, so re-runs are cheap.
        - task_key: ai_call_insights
          depends_on:
            - task_key: governance_comments_tags
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ai/call_insights.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
