# Daily Fleetwise job. Task 2 adds `generate_data`; later tasks extend the DAG
# (governance, pipeline refresh, AI insights, scoring, NBA, Lakebase sync ...).
resources:
  jobs:
    seller_superapp_daily:
      name: seller_superapp_daily
      description: Fleetwise Seller Super App - generate raw data, then (later tasks) refresh, score and sync.
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: init
        - name: batch
          default: "0"
        # Output goes to /Volumes/<catalog>/<schema>/<volume>/<dataset_version>/ (rulings R10, R12, R13: v4).
        - name: dataset_version
          default: v4
        # "true" runs the offline score evaluation (evaluate_scores) after next_best_actions.
        - name: run_eval
          default: "false"
      environments:
        - environment_key: generator_env
          spec:
            client: "4"
            dependencies:
              # pinned so serverless output is byte-identical to local runs
              - faker==40.54.0
        # scoring uses only what serverless ships (requests, databricks-sdk, pyspark)
        - environment_key: scoring_env
          spec:
            client: "4"
        # w.postgres (synced tables) needs databricks-sdk >= 0.81; pinned to the version tested locally
        - environment_key: lakebase_env
          spec:
            client: "4"
            dependencies:
              - databricks-sdk==0.167.0
        - environment_key: eval_env
          spec:
            client: "4"
            dependencies:
              - mlflow-skinny==3.18.0
      tasks:
        - task_key: generate_data
          environment_key: generator_env
          spark_python_task:
            python_file: ../jobs/generate_data.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --mode
              - "{{job.parameters.mode}}"
              - --batch
              - "{{job.parameters.batch}}"
              - --seed
              - "42"
              - --dataset-version
              - "{{job.parameters.dataset_version}}"
              - --src-dir
              - ${workspace.file_path}/src
        # Task 4 (ruling R2): governance objects the pipeline depends on come first.
        - task_key: governance_setup
          depends_on:
            - task_key: generate_data
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/setup.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # silver_contacts declares `MASK fn_mask_pii`, so the mask functions must exist first.
        - task_key: governance_masks
          depends_on:
            - task_key: governance_setup
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/masks.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 3: refresh the bronze -> silver -> gold pipeline after new raw files land.
        - task_key: pipeline_refresh
          depends_on:
            - task_key: governance_masks
          pipeline_task:
            pipeline_id: ${resources.pipelines.seller_superapp_pipeline.id}
            full_refresh: false
        # Task 4: row-filter functions + governed views (they read gold_user_hierarchy).
        - task_key: apply_governance
          depends_on:
            - task_key: pipeline_refresh
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/row_filters.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 4: PII tags on pipeline tables and column comments on the governed views.
        - task_key: governance_comments_tags
          depends_on:
            - task_key: apply_governance
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/governance/comments_tags.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 5: GenAI call insights (ai_query) -> gold_call_insights. Incremental MERGE: only
        # new/changed/failed transcripts are sent to the model, so re-runs are cheap.
        - task_key: ai_call_insights
          depends_on:
            - task_key: governance_comments_tags
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ai/call_insights.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 6: OpenJev deal + lead scoring -> gold_deal_scores / gold_lead_scores. Incremental
        # MERGE (only changed opps/leads are scored); fails only if > 5% of OpenJev calls fail.
        - task_key: ai_scoring
          depends_on:
            - task_key: ai_call_insights
          environment_key: scoring_env
          spark_python_task:
            python_file: ../jobs/run_scoring.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --max-workers
              - "16"
              - --src-dir
              - ${workspace.file_path}/src
        # Task 8: write-back. Seller decisions from the app (Lakebase app.seller_actions, landed in
        # UC by Lakehouse Sync) -> silver_seller_actions -> gold_nba_feedback + NBA status. Runs
        # before next_best_actions so this run's ranking uses the fresh acceptance rates. No-op
        # (empty targets) until the app creates schema app (Task 10).
        - task_key: writeback_merge
          depends_on:
            - task_key: ai_scoring
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/lakebase/writeback.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              lakebase_catalog: ${var.lakebase_catalog}
        # Task 7: next best actions + gold_opportunity_app (pipeline joined with deal scores), both
        # rebuilt by MERGE with stable keys (R3, R17). Lakebase (Task 8) syncs them into the app.
        - task_key: next_best_actions
          depends_on:
            - task_key: writeback_merge
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ai/next_best_actions.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        # Task 8: refresh the Lakebase synced tables (gold -> Postgres schema serving) and wait.
        - task_key: lakebase_sync
          depends_on:
            - task_key: next_best_actions
          environment_key: lakebase_env
          spark_python_task:
            python_file: ../src/lakebase/setup_lakebase.py
            parameters:
              - --action
              - sync
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --serving-schema
              - ${var.serving_schema}
              - --project
              - ${var.lakebase_project}
              - --lakebase-catalog
              - ${var.lakebase_catalog}
        # Task 7: offline score evaluation (~400 OpenJev calls + MLflow), only when run_eval=true.
        - task_key: check_run_eval
          depends_on:
            - task_key: next_best_actions
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.run_eval}}"
            right: "true"
        - task_key: evaluate_scores
          depends_on:
            - task_key: check_run_eval
              outcome: "true"
          environment_key: eval_env
          spark_python_task:
            python_file: ../jobs/evaluate_scores.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.volume}
              - --dataset-version
              - "{{job.parameters.dataset_version}}"
              - --src-dir
              - ${workspace.file_path}/src
